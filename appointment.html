<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

 <section class="section fade-in">
    <a href="index.html" class="btn">← Back to Home</a>

    <h2>Book Appointment</h2>

     <form onsubmit="sendToWhatsApp(); return false;" class="form">
   <label for="name">Patient Name</label>
<input type="text" id="name" placeholder="Enter your name" required>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required>

<label for="date">Appointment Date</label>
<input type="date" id="date" required>

<label for="time">Appointment Time</label>
<input type="time" id="time" required>

<label for="doctor">Select Doctor</label>
<select id="doctor" required>
    <option value="">Choose Doctor</option>
    <option>Dr. P. Uma Madhulatha</option>
    <option>Dr. I. Venkata Kiran Kumar Raju</option>
</select>

<button type="submit">Book Now</button>
</form>
</section>

<script>
function sendToWhatsApp() {
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let date = document.getElementById("date").value;
    let time = document.getElementById("time").value;
    let doctor = document.getElementById("doctor").value;

 let message = encodeURIComponent(
`🏥 Sanjeevani Hospital Appointment

Name: ${name}
Phone: ${phone}
Doctor: ${doctor}
Date: ${date}
Time: ${time}`
);
alert("Opening WhatsApp to confirm your appointment...");

let url = "https://wa.me/919494282412?text=" + message;
window.open(url, "_blank");
}
</script>

</body>
</html>
